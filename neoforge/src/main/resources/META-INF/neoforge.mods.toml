modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"
issueTrackerURL = "https://github.com/MairwunNx/minecraft-worldapi/issues"

[[mods]]
modId = "worldapi"
version = "${version}"
displayName = "WorldAPI"
displayURL = "https://github.com/MairwunNx/minecraft-worldapi"
iconFile = "worldapi.png"
authors = "MairwunNx"
description = '''
A REST and WebSocket API for your world: players, statistics, events, and admin actions, with an admin panel. On a server, or in singleplayer for an AI agent through minecraft-mcp.
'''

[[mixins]]
config = "worldapi.mixins.json"

[[dependencies.worldapi]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.worldapi]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft},26.4)"
ordering = "NONE"
side = "BOTH"

[[dependencies.worldapi]]
modId = "luckperms"
type = "optional"
versionRange = "*"
ordering = "NONE"
side = "SERVER"
