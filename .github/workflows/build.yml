name: Build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      # The admin panel builds with Bun inside the Gradle build.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        # Builds outside a release carry the commit in their version, so a jar always says where it came from.
        run: ./gradlew build -PreleaseVersion="dev-${GITHUB_SHA::7}"
      - uses: actions/upload-artifact@v7
        with:
          name: worldapi
          path: build/libs/*.jar
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: build/reports/tests/
