name: Release

# Run by hand: Actions → Release → Run workflow, with the new version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, like 2.0.0"
        required: true
      changelog:
        description: "Changelog in Markdown; leave empty to take the version's section from CHANGELOG.md"
        required: false
      modrinth:
        description: "Also publish to Modrinth (needs the MODRINTH_TOKEN secret)"
        type: boolean
        default: false
      hangar:
        description: "Also publish to Hangar (needs the HANGAR_TOKEN secret)"
        type: boolean
        default: false
      moonlands:
        description: "Ship the release to Moonlands (needs the FAMILY_ACTIONS_TOKEN secret)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      CHANGELOG: ${{ inputs.changelog }}
      # Outside the repo files, but in the workspace, where Gradle finds it by a relative path.
      NOTES: release-notes.md
    steps:
      - uses: actions/checkout@v7
      - name: Check the version
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::$VERSION isn't a version like 2.0.0"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::v$VERSION is already released"; exit 1
          fi
      - name: Write the release notes
        shell: python
        run: |
          import os, re, sys
          version, typed = os.environ["VERSION"], os.environ["CHANGELOG"].strip()
          if typed:
              notes = typed
          else:
              text = open("CHANGELOG.md", encoding="utf-8").read()
              match = re.search(rf"^## {re.escape(version)}\s*$(.*?)(?=^## |\Z)", text, re.M | re.S)
              notes = match.group(1).strip() if match else ""
          if not notes:
              sys.exit(f"::error::No changelog: add a “## {version}” section to CHANGELOG.md or fill the changelog field")
          open(os.environ["NOTES"], "w", encoding="utf-8").write(notes + "\n")
          print(notes)
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      # The admin panel builds with Bun inside the Gradle build.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: gradle/actions/setup-gradle@v6
      - name: Read the platforms
        # `worldapi.mods` in gradle.properties: off while the mods are only frames, so the release ships Paper alone
        # under its old names; on, it ships all three platforms. Empty mods must never reach a store.
        run: echo "MODS=$(sed -n 's/^worldapi\.mods=//p' gradle.properties)" >> "$GITHUB_ENV"
      - name: Build and test
        run: ./gradlew build -PreleaseVersion="$VERSION"
      - name: Publish the GitHub release
        if: env.MODS != 'true'
        # worldapi.jar too, so releases/latest/download/worldapi.jar always fetches the newest one.
        run: |
          cp "paper/build/libs/worldapi-$VERSION.jar" paper/build/libs/worldapi.jar
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "WorldAPI $VERSION" --notes-file "$NOTES" "paper/build/libs/worldapi-$VERSION.jar" paper/build/libs/worldapi.jar
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish the GitHub release with the mods
        if: env.MODS == 'true'
        # Every jar twice: with its version, and without, so releases/latest/download/worldapi-paper.jar,
        # worldapi-fabric.jar, and worldapi-neoforge.jar always fetch the newest; worldapi.jar too, the Paper jar's
        # name before the mods, so links to it keep working.
        run: |
          cp "paper/build/libs/worldapi-paper-$VERSION.jar" paper/build/libs/worldapi-paper.jar
          cp "paper/build/libs/worldapi-paper-$VERSION.jar" paper/build/libs/worldapi.jar
          cp "fabric/build/libs/worldapi-fabric-$VERSION.jar" fabric/build/libs/worldapi-fabric.jar
          cp "neoforge/build/libs/worldapi-neoforge-$VERSION.jar" neoforge/build/libs/worldapi-neoforge.jar
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "WorldAPI $VERSION" --notes-file "$NOTES" \
            "paper/build/libs/worldapi-paper-$VERSION.jar" paper/build/libs/worldapi-paper.jar paper/build/libs/worldapi.jar \
            "fabric/build/libs/worldapi-fabric-$VERSION.jar" fabric/build/libs/worldapi-fabric.jar \
            "neoforge/build/libs/worldapi-neoforge-$VERSION.jar" neoforge/build/libs/worldapi-neoforge.jar
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish to Modrinth
        if: inputs.modrinth
        # Minotaur reads the project while it runs, which the configuration cache doesn't allow. With the mods on, it
        # uploads X.Y.Z+paper; the mods go through Modrinth's v3 API as X.Y.Z+fabric and X.Y.Z+neoforge, since Minotaur
        # can't set the environment Modrinth asks of a mod.
        run: |
          ./gradlew :paper:modrinth -PreleaseVersion="$VERSION" -PchangelogFile="$NOTES" --no-configuration-cache
          if [[ "$MODS" == "true" ]]; then python3 -I scripts/modrinth_mods.py --version "$VERSION" --notes "$NOTES"; fi
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      - name: Publish to Hangar
        # Paper only, numbered X.Y.Z, with or without the mods.
        if: inputs.hangar
        run: ./gradlew :paper:publishPluginPublicationToHangar -PreleaseVersion="$VERSION" -PchangelogFile="$NOTES" --no-configuration-cache
        env:
          HANGAR_TOKEN: ${{ secrets.HANGAR_TOKEN }}

  deploy:
    needs: release
    if: inputs.moonlands
    runs-on: ubuntu-latest
    steps:
      - name: Ship to Moonlands
        # Moonlands' “Ship a release” workflow puts the new jar on the server, unless it's built for another game version.
        run: gh workflow run ship-plugin.yml -R MairwunNx/minecraft -f repo="$GITHUB_REPOSITORY" -f version="$VERSION"
        env:
          GH_TOKEN: ${{ secrets.FAMILY_ACTIONS_TOKEN }}
          VERSION: ${{ inputs.version }}
